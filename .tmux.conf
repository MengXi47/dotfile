


### 顏色與終端 ###
set -g default-terminal "screen-256color"
set -g status-interval 1

set -g mouse off

### 狀態列樣式 ###
set -g status on
set -g status-justify centre
set -g status-left-length 40
set -g status-right-length 150
set -g status-fg white
set -g status-bg colour234

### 分段樣式 ###
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour39
set -g message-style fg=colour16,bg=colour221,bold
set -g window-status-style fg=colour245,bg=colour234
set -g window-status-current-style fg=colour234,bg=colour39,bold

### 狀態列內容 ###
set -g status-left '#[fg=colour16,bg=colour51,bold]  #S #[fg=colour51,bg=colour238]⮀'
set -g status-right '#[fg=green,bg=black]#(tmux-mem-cpu-load --powerline-right --interval 5) #[fg=colour237,bg=colour60]#[fg=colour144,bg=colour237] %Y/%m/%d  %H:%M:%S #[fg=colour27,bg=colour237]#[fg=colour15,bg=colour27] #h'
